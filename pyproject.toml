[project]
name = "dbtlearn-snowflake-importer"
version = "0.1.0"
description = "Streamlit app to help students set up Snowflake for dbt Zero to Hero course"
requires-python = "==3.13.*"
dependencies = [
    "streamlit==1.61.1",
    "sqlalchemy==2.0.51",
    "snowflake-sqlalchemy==1.11.0",
    "snowflake-connector-python==4.7.1",
    "pydantic==2.13.4",
    "cryptography==50.0.0",
    "pyyaml==6.0.3",
    "watchdog==6.0.0",
    # Security fixes for transitive dependencies
    "urllib3==2.7.0",
    "filelock==3.32.2",
    "gitpython==3.1.58",
    "pillow==12.3.0",
    "pygments==2.20.0",
    "requests==2.34.2",
    "pyopenssl==26.4.0",
    "pyjwt==2.13.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "flake8==7.3.0",
    "isort==8.0.1",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "python-dotenv==1.2.2",
    "playwright==1.62.0",
]
